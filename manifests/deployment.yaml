apiVersion: apps/v1
kind: Deployment
metadata:
  name: mlops-base-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: mlops-base-app
  template:
    metadata:
      labels:
        app: mlops-base-app
    spec:
      containers:
        - name: web
          image: nginx:1.25-alpine
          ports:
            - containerPort: 80
