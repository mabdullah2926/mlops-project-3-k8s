apiVersion: argoproj.io/v1alpha1
kind: Workflow
metadata:
  generateName: iris-classification-pipeline-
  annotations:
    pipelines.kubeflow.org/kfp_sdk_version: 2.7.0
    pipelines.kubeflow.org/pipeline_spec: '{"description": "Iris ML pipeline", "name":
      "iris-classification-pipeline"}'
spec:
  entrypoint: iris-classification-pipeline
  templates:
  - name: iris-classification-pipeline
    dag:
      tasks:
      - name: load-and-preprocess-data
        template: load-and-preprocess-data
      - name: train-model
        template: train-model
        dependencies:
        - load-and-preprocess-data
        arguments:
          artifacts:
          - name: dataset
            from: '{{tasks.load-and-preprocess-data.outputs.artifacts.dataset}}'
      - name: evaluate-and-register-model
        template: evaluate-and-register-model
        dependencies:
        - train-model
        arguments:
          artifacts:
          - name: dataset
            from: '{{tasks.load-and-preprocess-data.outputs.artifacts.dataset}}'
          - name: model
            from: '{{tasks.train-model.outputs.artifacts.model}}'
  - name: load-and-preprocess-data
    container:
      image: python:3.11-slim
      command:
      - sh
      - -c
      - pip install --quiet scikit-learn pandas && python3 -c "from sklearn.datasets
        import load_iris; from sklearn.model_selection import train_test_split; df
        = load_iris(as_frame=True).frame; tr, te = train_test_split(df, test_size=0.2,
        random_state=42); tr.to_csv('/tmp/train.csv'); te.to_csv('/tmp/test.csv');
        print('Preprocessed OK')"
    outputs:
      artifacts:
      - name: dataset
        path: /tmp
  - name: train-model
    inputs:
      artifacts:
      - name: dataset
        path: /tmp/in
    container:
      image: python:3.11-slim
      command:
      - sh
      - -c
      - pip install --quiet scikit-learn pandas joblib && python3 -c "import joblib,
        pandas as pd; from sklearn.ensemble import RandomForestClassifier; df = pd.read_csv('/tmp/in/train.csv');
        clf = RandomForestClassifier(n_estimators=100, random_state=42).fit(df.drop(columns=['target']),
        df['target']); joblib.dump(clf, '/tmp/model.joblib'); print('Trained OK')"
    outputs:
      artifacts:
      - name: model
        path: /tmp/model.joblib
  - name: evaluate-and-register-model
    inputs:
      artifacts:
      - name: dataset
        path: /tmp/in
      - name: model
        path: /tmp/model.joblib
    container:
      image: python:3.11-slim
      command:
      - sh
      - -c
      - pip install --quiet scikit-learn pandas joblib && python3 -c "import joblib,
        pandas as pd; from sklearn.metrics import accuracy_score; df = pd.read_csv('/tmp/in/test.csv');
        clf = joblib.load('/tmp/model.joblib'); print('Accuracy:', accuracy_score(df['target'],
        clf.predict(df.drop(columns=['target']))))"
    outputs:
      artifacts:
      - name: metrics
        path: /tmp/metrics
